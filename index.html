<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bubbles</title>
    <meta name="description" content="Real-time chat with your friends." />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <script>
      // Apply saved theme + accent before first paint (no flash).
      try {
        const t = localStorage.getItem('bubbles.theme')
        if (t && t !== 'system') document.documentElement.dataset.theme = t
        const a = localStorage.getItem('bubbles.accent')
        const at = localStorage.getItem('bubbles.appTheme')
        if (at && at !== 'default') document.documentElement.dataset.appTheme = at
        else if (a) document.documentElement.style.setProperty('--accent', a)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
